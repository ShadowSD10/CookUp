    <linearGradient id="shoe" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#3e4b5a"/><stop offset=".48" stop-color="#192331"/><stop offset="1" stop-color="#080d17"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e6a352"/><stop offset=".35" stop-color="#bd7032"/><stop offset=".7" stop-color="#f0b765"/><stop offset="1" stop-color="#8c4e2c"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".35" stop-color="#c4d8dd"/><stop offset=".62" stop-color="#668995"/><stop offset="1" stop-color="#e9fbff"/></linearGradient>
