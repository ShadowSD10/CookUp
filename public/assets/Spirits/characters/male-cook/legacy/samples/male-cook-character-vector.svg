    <filter id="ambient" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="tinyBlur"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

