  <title id="title">Friendly male chef character</title>
  <desc id="desc">Full-body stylized male cook for a 2D cooking game, rendered as editable layered vector art.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9b0"/><stop offset=".48" stop-color="#f0ad7d"/><stop offset="1" stop-color="#b96755"/></linearGradient>
