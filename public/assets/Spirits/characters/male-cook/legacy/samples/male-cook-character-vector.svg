    <linearGradient id="hatFold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c4dce2"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a5c1ca"/></linearGradient>
